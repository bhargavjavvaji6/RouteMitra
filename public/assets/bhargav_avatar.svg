<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
    <linearGradient id="skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C68642"/>
      <stop offset="100%" stop-color="#A5632A"/>
    </linearGradient>
    <linearGradient id="shirt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
  </defs>
  <!-- Background Circle -->
  <circle cx="60" cy="60" r="58" fill="url(#bg)" stroke="#93C5FD" stroke-width="3"/>
  <!-- Hair Back -->
  <ellipse cx="60" cy="46" rx="23" ry="25" fill="#1C1917"/>
  <!-- Ears -->
  <circle cx="37" cy="56" r="6" fill="#C68642"/>
  <circle cx="83" cy="56" r="6" fill="#C68642"/>
  <!-- Neck -->
  <path d="M50 70 L50 84 L70 84 L70 70 Z" fill="#A5632A"/>
  <!-- Face -->
  <ellipse cx="60" cy="54" rx="20" ry="24" fill="url(#skin)"/>
  <!-- Hair Front -->
  <path d="M38 46 Q60 22 82 46 Q70 34 60 36 Q50 34 38 46 Z" fill="#1C1917"/>
  <!-- Glasses -->
  <rect x="42" y="48" width="14" height="11" rx="2.5" fill="none" stroke="#0F172A" stroke-width="2.5"/>
  <rect x="64" y="48" width="14" height="11" rx="2.5" fill="none" stroke="#0F172A" stroke-width="2.5"/>
  <line x1="56" y1="52" x2="64" y2="52" stroke="#0F172A" stroke-width="2"/>
  <!-- Beard & Mustache -->
  <path d="M46 64 Q60 78 74 64 Q69 76 60 77 Q51 76 46 64 Z" fill="#1C1917"/>
  <path d="M50 63 Q60 61 70 63 Q60 65 50 63 Z" fill="#1C1917"/>
  <!-- Eyes -->
  <circle cx="49" cy="53" r="2" fill="#1E293B"/>
  <circle cx="71" cy="53" r="2" fill="#1E293B"/>
  <!-- Patterned Shirt -->
  <path d="M26 112 C28 88 44 84 50 84 L70 84 C76 84 92 88 94 112 Z" fill="url(#shirt)"/>
  <path d="M60 84 L60 112" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="2,2"/>
  <!-- Collar -->
  <polygon points="50,84 60,94 56,84" fill="#E2E8F0"/>
  <polygon points="70,84 60,94 64,84" fill="#CBD5E1"/>
</svg>
