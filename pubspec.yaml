name: routemitra
description: RouteMitra - Travel together. Reach together.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0
  google_maps_flutter: ^2.12.0
  geolocator: ^14.0.0
  shared_preferences: ^2.5.3
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/route_mitra_logo.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/route_mitra_logo.png
  adaptive_icon_background: '#06172D'
  adaptive_icon_foreground: assets/images/route_mitra_logo.png
